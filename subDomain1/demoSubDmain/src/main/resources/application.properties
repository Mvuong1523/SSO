spring.application.name=demoSubDmain

# Server Configuration
server.port=8081

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/subdomain_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.demoSubDmain.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Logging
logging.level.com.example.demoSubDmain=DEBUG

# Auth Server Configuration (for Public Key)
auth.server.url=http://localhost:8080
auth.server.public-key-endpoint=/api/auth/public-key

# CORS Configuration
cors.allowed-origins=http://localhost:5174,http://127.0.0.1:5174
