<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSO Login Center</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1> SSO Login Center</h1>
            <p>Đăng nhập một nơi, truy cập mọi nơi</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email / Tên đăng nhập</label>
                <div style="position: relative;">
                    <input type="text" id="email" name="email" required autocomplete="username" th:value="${savedEmail != null ? savedEmail : ''}">
                    <div id="savedAccountsDropdown" class="saved-accounts-dropdown" style="display: none;"> </div>
                    </div>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" th:value="${savedPassword != null ? savedPassword : ''}">
            </div>
            <div class = "form-group" style = "display: flex; aglign-items: center; gap: 8px;">
                <input type = "checkbox" id = "rememberMe" name ="rememberMe">
                <label for = "rememberMe" style="margin: 0; cursor: pointer;">Ghi nhớ đăng nhập</label>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Đăng Nhập</button>
        </form>

        <div id="loading" class="loading">Đang xử lý...</div>

        <div class="redirect-info">
            <strong>Redirecting to:</strong><br>
            <span id="redirectUri"></span>
        </div>

        <div class="redirect-info" style="margin-top: 10px;">
            Chưa có tài khoản? <a href="#" id="registerLink" style="color: #667eea; text-decoration: none; font-weight: 600;">Đăng ký ngay</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUri = urlParams.get('redirect_uri') || window.location.origin;
        document.getElementById('redirectUri').textContent = redirectUri;

        // Update register link to preserve redirect_uri
        const registerLink = document.getElementById('registerLink');
        if (redirectUri && redirectUri !== window.location.origin) {
            registerLink.href = `/register?redirect_uri=${encodeURIComponent(redirectUri)}`;
        } else {
            registerLink.href = '/register';
        }

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        const loading = document.getElementById('loading');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            errorMessage.classList.remove('show');
            loginBtn.disabled = true;
            loading.classList.add('show');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        username: email, 
                        password: password,
                        rememberMe: rememberMe
                    }),
                    credentials: 'include'
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Đăng nhập thất bại');
                }

                
                window.location.href = `/api/oauth/authorize?redirect_uri=${encodeURIComponent(redirectUri)}`;

            } catch (error) {
                errorMessage.textContent = error.message || 'Đăng nhập thất bại. Vui lòng kiểm tra lại!';
                errorMessage.classList.add('show');
                loginBtn.disabled = false;
                loading.classList.remove('show');
            }
        });
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) {
                return parts.pop().split(';').shift();
            }
            return null; 
        }
        const emailInput = document.getElementById('email');
        const dropdown = document.getElementById('savedAccountsDropdown');
        let savedAccountsList = [];

        window.addEventListener('DOMContentLoaded', () => {
        const savedAccounts = getCookie('savedAccounts');
        if (savedAccounts) {
            // Hỗ trợ cả | và , để tương thích cookie cũ
            const separator = savedAccounts.includes('|') ? '|' : ',';
            savedAccountsList = savedAccounts.split(separator).filter(e => e.trim());
        }
        });
        emailInput.addEventListener('focus', () => {
            if (savedAccountsList.length > 0) {
                showDropdown();
            }
        });

        document.addEventListener('click', (e) => {
            if (!emailInput.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        function showDropdown() {
            dropdown.innerHTML = '';
            
            if (savedAccountsList.length === 0) {
                dropdown.innerHTML = '<div class="no-saved-accounts">Chưa có tài khoản đã lưu</div>';
            } else {
                savedAccountsList.forEach(email => {
                    const item = document.createElement('div');
                    item.className = 'saved-account-item';
                    item.textContent = email;
                    item.onclick = () => selectAccount(email);
                    dropdown.appendChild(item);
                });
            }
            
            dropdown.style.display = 'block';
        }

        function selectAccount(email) {
            dropdown.style.display = 'none';
            
            const currentRedirectUri = urlParams.get('redirect_uri') || '';
            const url = `/login?email=${encodeURIComponent(email)}${currentRedirectUri ? '&redirect_uri=' + encodeURIComponent(currentRedirectUri) : ''}`;
            window.location.href = url;
        }

    </script>
</body>
</html>
