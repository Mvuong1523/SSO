# Application name
spring.application.name=VuongLM

# Server configuration
server.port=8080

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/demo
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.demoBe.entity
mybatis.configuration.map-underscore-to-camel-case=true


# Logging
logging.level.com.example.demoBe.mapper=DEBUG

# JWT Configuration (RSA keys)
jwt.rsa.private-key=classpath:keys/private_key.pem
jwt.rsa.public-key=classpath:keys/public_key.pem
jwt.access-token.expiration=60000
jwt.refresh-token.expiration=86400000


# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID_HERE}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_CLIENT_SECRET_HERE}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google


# Session Cookie Configuration for SSO
server.servlet.session.cookie.name=SSO_SESSION
# Domain removed to allow specific host-only cookie for login-center.com
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m
